[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
turin-contracts = { path = "crates/contracts" }
turin-shared = { path = "crates/shared" }
turin-persistence = { path = "crates/persistence" }
turin-git = { path = "crates/git" }
turin-source-control = { path = "crates/source-control" }
turin-provider-core = { path = "crates/provider-core" }
turin-codex-app-server = { path = "crates/codex-app-server" }
turin-claude-protocol = { path = "crates/claude-protocol" }
turin-acp = { path = "crates/acp" }
turin-provider-codex = { path = "crates/provider-codex" }
turin-provider-claude = { path = "crates/provider-claude" }
turin-provider-opencode = { path = "crates/provider-opencode" }
turin-provider-cursor = { path = "crates/provider-cursor" }
turin-orchestration = { path = "crates/orchestration" }
turin-hooks = { path = "crates/hooks" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
dirs = "6"
tempfile = "3"
pretty_assertions = "1"
markdown = "1.0.0"
url = "2"
percent-encoding = "2"
unicode-normalization = "0.1"
indexmap = { version = "2", features = ["serde"] }

gpui-kit = "0.7.3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
