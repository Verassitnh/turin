[package]
name = "turin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "turin"
path = "src/main.rs"

[dependencies]
turin-contracts.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gpui-kit.workspace = true
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Only for the `screenshot` feature: switches on GPUI's offscreen renderer.
gpui-pre = { version = "=0.3.9", default-features = false, optional = true }
gpui-pre-macos = { version = "=0.3.9", default-features = false, optional = true }

[features]
# Dev aid: `TURIN_SCREENSHOT=out.png cargo run -p turin --features screenshot`
# renders the first frames offscreen (GPUI's test-support `render_to_image`,
# no screen-recording permission needed), writes a PNG and quits.
screenshot = ["dep:image", "gpui-pre/test-support", "gpui-pre-macos/test-support"]
