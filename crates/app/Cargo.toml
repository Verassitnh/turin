[package]
name = "turin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "turin"
path = "src/main.rs"

[dependencies]
turin-contracts.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gpui-kit = { workspace = true, features = [
    # Code block highlighting (ChatMarkdown). Not `tree-sitter-languages`:
    # its SQL grammar pins `cc ~1.2`, which conflicts with rusqlite.
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-elixir",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
markdown = "1"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
